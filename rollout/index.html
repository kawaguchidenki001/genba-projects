<section class="hero"><h2>販売前・お客様引き渡し前の最終チェックリスト</h2><p>初期設定、主要機能、スマホ運用、販売書類、サポート体制を順番に確認します。チェック状態はこの端末に保存されます。</p><div class="progress"><div class="bar" id="bar"></div></div><div class="summary"><span class="pill" id="sumDone">完了 0件</span><span class="pill" id="sumRemain">残り 0件</span><span class="pill" id="sumRate">0%</span></div><div class="actions"><button class="btn primary" onclick="copyMemo()">引き渡しメモをコピー</button><button class="btn" onclick="window.print()">印刷</button><button class="btn" onclick="resetChecks()">全解除</button></div></section>
<div class="links"><a href="../setup/">初期設定</a><a href="../finalcheck/">最終チェック</a><a href="../diagnosis/">エラー診断</a><a href="../sales/">販売設定</a><a href="../legal/">規約</a><a href="../backup/">バックアップ</a><a href="../demo/">デモ</a><a href="../support/">サポート</a></div>
<div class="grid" id="cards"></div>
<section class="card" style="margin-top:14px"><h3>引き渡しメモ</h3><p class="note">お客様へ説明した内容や未完了項目の共有に使います。</p><div class="copybox" id="memo"></div><div class="actions"><button class="btn primary" onclick="copyMemo()">コピー</button><a class="linkbtn" href="../start/">利用開始ガイドを開く</a><a class="linkbtn" href="../faq/">FAQを開く</a></div></section>
</div><script>
var APP_VERSION=(window.GENBA_CONFIG&&window.GENBA_CONFIG.APP_VERSION)||'v2026.06.20-43.7';var BUILD_ID=(window.GENBA_CONFIG&&window.GENBA_CONFIG.BUILD)||'20260620-v43-7-audit';document.getElementById('appBadge').textContent=APP_VERSION;var KEY='gencan_rollout_check_v41';
var groups=[{title:'1. 基本設定',items:[['会社名・販売会社情報を設定済み','販売設定と設定シートの会社情報を確認'],['作業員マスタを登録済み','管理者、社員、現場作業員、閲覧者を設定'],['権限と利用状態を確認済み','停止ユーザーがログインできないことも確認'],['Drive親フォルダを確認済み','案件フォルダ・写真・台帳フォルダの作成確認'],['自動バックアップを有効化済み','バックアップフォルダと保存世代を確認']]},{title:'2. 主要機能テスト',items:[['ログイン・ログアウト確認','PCとスマホでID/パスワードログイン確認'],['案件登録・編集確認','官公庁/民間/個人の階層で確認'],['ファイル画面確認','現場名→Drive風階層→ファイル追加まで確認'],['小黒板カメラ確認','カメラ起動、小黒板表示、戻る先を確認'],['工事写真台帳確認','写真選択、並び替え、PDF/Excel作成まで確認'],['日報・タイムカード確認','現場担当者が迷わず入力できるか確認']]},{title:'3. 現場運用準備',items:[['スマホ表示確認','ボタンサイズ、下部固定ボタン、入力欄を確認'],['現場クイックを説明済み','よく使う入口として案内'],['利用開始ガイドを共有済み','初めての人向け手順を説明'],['FAQ・困った時を案内済み','問い合わせ前の確認手順を説明'],['サポート依頼の使い方を説明済み','端末情報付きで問い合わせできることを説明']]},{title:'4. 販売・引き渡し',items:[['利用規約・プライバシーポリシー確認済み','正式版URLまたはたたき台を確認'],['特定商取引法表示を確認済み','販売会社、料金、連絡先を確認'],['デモモードで説明練習済み','販売時の説明順を確認'],['更新手順を説明済み','GitHub上書きとGAS再デプロイを説明'],['最終チェックとエラー診断OK','納品前に両方実行して結果を確認']]}];
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function load(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}}function save(o){try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}}function id(g,i){return 'g'+g+'i'+i}function render(){var st=load(),total=0,done=0;document.getElementById('cards').innerHTML=groups.map(function(g,gi){return '<section class="card"><h3>'+esc(g.title)+'</h3><div class="items">'+g.items.map(function(it,ii){var k=id(gi,ii),ck=!!st[k];total++;if(ck)done++;return '<label class="item"><input type="checkbox" '+(ck?'checked':'')+' onchange="toggle(\''+k+'\',this.checked)"><div><b>'+esc(it[0])+'</b><span>'+esc(it[1])+'</span></div></label>';}).join('')+'</div></section>';}).join('');var rate=total?Math.round(done/total*100):0;document.getElementById('bar').style.width=rate+'%';document.getElementById('sumDone').textContent='完了 '+done+'件';document.getElementById('sumRemain').textContent='残り '+(total-done)+'件';document.getElementById('sumRate').textContent=rate+'%';renderMemo(st,total,done,rate)}function toggle(k,v){var st=load();st[k]=!!v;save(st);render()}function resetChecks(){if(!confirm('導入チェックを全解除しますか？'))return;localStorage.removeItem(KEY);render()}function memoText(st,total,done,rate){var lines=[];lines.push('Gen-Can 導入チェック');lines.push('アプリ：'+APP_VERSION);lines.push('BUILD：'+BUILD_ID);lines.push('進捗：'+done+'/'+total+'件（'+rate+'%）');lines.push('');groups.forEach(function(g,gi){lines.push('【'+g.title+'】');g.items.forEach(function(it,ii){var k=id(gi,ii);lines.push((st[k]?'[完了] ':'[未完了] ')+it[0]+' - '+it[1]);});lines.push('')});lines.push('未完了項目を完了後、最終チェック・エラー診断・バックアップ確認を行ってください。');return lines.join('\n')}function renderMemo(st,total,done,rate){document.getElementById('memo').textContent=memoText(st,total,done,rate)}async function copyMemo(){var st=load(),total=0,done=0;groups.forEach(function(g,gi){g.items.forEach(function(it,ii){total++;if(st[id(gi,ii)])done++;})});var rate=total?Math.round(done/total*100):0;var tx=memoText(st,total,done,rate);try{await navigator.clipboard.writeText(tx);alert('引き渡しメモをコピーしました。')}catch(e){var ta=document.createElement('textarea');ta.value=tx;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();alert('コピーしました。')}}render();
</script><script src="../common_ui.js?v=20260620-v43-7-audit"></script></body></html>
