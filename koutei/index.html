<!DOCTYPE html>
<!-- koutei v43.16.0 (2026-07-04) スピナーの人工待ち(最小表示時間)を撤去し150ms遅延表示方式に変更（速い処理はスピナー非表示）。GAS変更なし。 -->
<!-- koutei v43.11.0 (2026-07-04) config.jsを先頭読み込みに変更（GAS URL差し替え対応）。リンク相対化。GAS変更なし。 -->
<!-- koutei version 4 (2026-06-25) 上部の状態フィルタを削除／工期バーを薄い帯にし、作業日報がある日(=現場に入った日)を濃いセルで重ね表示／濃いセルのタップでその日の作業内容と人員(氏名)をポップアップ。日報は reports API で取得しキャッシュ。GAS変更なし。 -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>工程表｜Gen-Can</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Montserrat:ital,wght@1,900&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e8ecf2;--bg1:#eef0fb;--bg2:#f7f8ff;--card:#ffffff;--line:#dcdcf2;--ink:#272752;--sub:#6d6d9a;
    --accent:#5b5bd6;--accent-d:#4444b8;--accent-soft:#ecebfb;
    --s-見積中:#6b7280;--s-受注:#2563eb;--s-施工中:#ea580c;--s-完了:#16a34a;--s-請求:#7c3aed;--s-入金:#0d9488;
    --radius:13px;--shadow:0 2px 10px rgba(40,60,100,.10);--shadow-lg:0 8px 24px rgba(40,60,100,.16);
    --grad:linear-gradient(92deg,#06b6d4 10%,#2563eb 55%,#7c3aed 95%);
    --rise:6px 6px 12px #cdd3dc,-6px -6px 12px #ffffff;
    --rise-sm:4px 4px 8px #cdd3dc,-4px -4px 8px #ffffff;
    --well:inset 3px 3px 6px #cdd3dc,inset -3px -3px 6px #ffffff;
    --well-soft:inset 2px 2px 5px #d3d9e1,inset -2px -2px 5px #fbfdff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--bg);min-height:100vh;color:var(--ink);font-family:"Zen Kaku Gothic New",-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;font-size:15.5px;line-height:1.55;padding-bottom:80px;}
  select,input,textarea,button,a{font-family:inherit;}
  header{position:sticky;top:0;z-index:20;background:var(--bg);color:var(--ink);padding:calc(env(safe-area-inset-top) + 11px) 14px 11px;box-shadow:0 6px 14px -10px rgba(31,90,168,.4);}
  .hbar{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"back . right" "title title title";align-items:center;row-gap:12px;column-gap:8px;max-width:760px;margin:0 auto;}
  .hbar .back{grid-area:back;align-self:center;}
  .hbar .hright{grid-area:right;justify-self:end;}
  .hbar .hcenter{grid-area:title;justify-self:center;}
  .hbar .htxt .nm{white-space:normal;}
  #admBtn{display:none!important;}
  .back{font-family:"Manrope",sans-serif;font-weight:700;font-size:11px;letter-spacing:.05em;color:var(--accent-d);background:var(--bg);box-shadow:var(--rise-sm);border-radius:999px;padding:8px 12px;text-decoration:none;white-space:nowrap;flex:0 0 auto;}
  .back:active{box-shadow:var(--well);}
  .hic{width:40px;height:40px;border-radius:50%;background:var(--bg);box-shadow:var(--well);display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--accent);}
  .hic svg{width:21px;height:21px;}
  .htxt{flex:1;min-width:0;}
  .htxt .en{font-family:"Manrope",sans-serif;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--sub);display:block;}
  .htxt .nm{font-weight:700;font-size:16.5px;color:var(--ink);display:block;line-height:1.2;white-space:nowrap;}
  .hmark{font-family:"Montserrat",sans-serif;font-weight:900;font-style:italic;font-size:13px;background-image:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;flex:0 0 auto;}
  .hd2{display:flex;align-items:center;gap:8px;max-width:760px;margin:9px auto 0;}
  .hd2 .sp{flex:1;}
  .sync{font-size:12px;display:flex;align-items:center;gap:6px;color:var(--sub);}
  .dot{width:8px;height:8px;border-radius:50%;background:#9ca3af;display:inline-block;}
  .dot.ok{background:#22a06b;} .dot.busy{background:#e8910b;} .dot.off{background:#e5484d;}
  .ghost{padding:8px 12px;border:none;border-radius:10px;background:var(--bg);box-shadow:var(--rise-sm);color:var(--accent-d);font-size:13px;cursor:pointer;font-weight:700;}
  .ghost:active{box-shadow:var(--well);}
  .toolbar{padding:10px 12px;display:flex;flex-direction:column;gap:8px;position:sticky;top:58px;background:var(--bg);z-index:10;max-width:760px;margin:0 auto;}
  .search{display:flex;gap:8px;}
  .search input{flex:1;padding:11px 13px;border:none;border-radius:11px;font-size:15.5px;background:var(--bg);box-shadow:var(--well);color:var(--ink);}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:2px;}
  .chip{flex:0 0 auto;padding:7px 13px;border:none;border-radius:999px;background:var(--bg);box-shadow:var(--rise-sm);color:var(--sub);font-size:13px;cursor:pointer;white-space:nowrap;font-weight:700;}
  .chip.on{background:var(--ink);color:#fff;box-shadow:var(--well-soft);}
  .schip{flex:0 0 auto;padding:6px 12px;border:2px solid;border-radius:999px;font-size:13px;cursor:pointer;white-space:nowrap;font-weight:800;background:var(--bg);transition:background .15s,color .15s;}
  .row2{display:flex;gap:8px;align-items:center;}
  select.sort{flex:1;padding:10px 11px;border:none;border-radius:11px;background:var(--bg);box-shadow:var(--well);font-size:14px;color:var(--ink);}
  main{padding:4px 12px 12px;max-width:760px;margin:0 auto;}
  .count{font-size:12px;color:var(--sub);margin:2px 2px 8px;}
  .card{background:var(--bg);border:none;border-left:5px solid var(--line);border-radius:var(--radius);box-shadow:var(--rise-sm);padding:12px 14px;margin-bottom:10px;cursor:pointer;display:flex;flex-direction:column;gap:6px;}
  .card:active{box-shadow:var(--well);}
  .card .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;}
  .card .name{font-weight:700;font-size:15.5px;color:var(--ink);}
  .card .id{font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums;}
  .badge{font-size:11px;font-weight:700;color:#fff;padding:3px 9px;border-radius:999px;white-space:nowrap;}
  .rfbtn{border:none;background:var(--bg);box-shadow:var(--rise-sm);border-radius:50%;width:28px;height:28px;cursor:pointer;font-size:14px;color:var(--sub);line-height:1;}
  .rfbtn:active{box-shadow:var(--well);}
  .tile.hl{animation:hlpulse 2.5s ease;}
  @keyframes hlpulse{0%{box-shadow:0 0 0 4px #f5a623;}70%{box-shadow:0 0 0 4px rgba(245,166,35,.35);}100%{box-shadow:var(--rise-sm);}}
  .tbar{height:5px;background:var(--bg);box-shadow:var(--well-soft);border-radius:3px;margin-top:6px;overflow:hidden;width:100%;}
  .tbarin{height:100%;border-radius:3px;}
  .tbartx{font-size:10px;font-weight:700;margin-top:3px;}
  .meta{font-size:13px;color:var(--sub);display:flex;flex-wrap:wrap;gap:4px 12px;}
  .meta b{color:var(--ink);font-weight:600;}
  .yen{font-variant-numeric:tabular-nums;}
  .flag{font-size:11px;color:#b45309;font-weight:700;}
  .empty{text-align:center;color:var(--sub);padding:40px 10px;font-size:14.5px;}
  .group{margin-bottom:18px;}
  .ghd{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;color:var(--ink);margin:2px 2px 11px;padding-bottom:7px;border-bottom:2px solid var(--line);}
  .ghd .gc{flex:0 0 auto;width:9px;height:9px;border-radius:50%;background:var(--accent);}
  .ghd .gn{flex:1;}
  .ghd .gcount{font-size:12px;color:var(--sub);font-weight:600;}
  .tiles{display:flex;flex-wrap:wrap;gap:8px;}
  .tile{flex:0 0 calc((100% - 18px)/3);max-width:calc((100% - 18px)/3);box-sizing:border-box;position:relative;background:var(--bg);border:none;border-top:4px solid var(--line);border-radius:14px;box-shadow:var(--rise-sm);padding:12px 6px 11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;min-height:86px;justify-content:center;}
  .tile:active{transform:scale(.97);box-shadow:var(--well);}
  .tile .ic{font-size:26px;line-height:1;color:var(--accent-d);}
  .tile .ic svg{width:26px;height:26px;display:block;}
  .tile .tn{font-size:12px;font-weight:700;line-height:1.22;word-break:break-word;color:var(--ink);}
  .tile .ts{font-size:10.5px;font-weight:700;color:#fff;padding:1px 7px;border-radius:999px;}
  .tile .edit{position:absolute;top:5px;right:5px;width:26px;height:26px;border-radius:8px;border:none;background:var(--bg);box-shadow:var(--rise-sm);font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--sub);}
  .tile .edit:active{box-shadow:var(--well);}
  .d-sub{font-size:13px;color:var(--sub);margin:0 0 12px;}
  .d-rows{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
  .d-row{display:flex;gap:10px;font-size:14px;}
  .d-row .k{flex:0 0 80px;color:var(--sub);font-size:12.5px;padding-top:1px;}
  .d-row .v{flex:1;font-weight:600;word-break:break-word;}
  .d-map{display:block;text-align:center;padding:12px;background:var(--bg);box-shadow:var(--rise-sm);color:var(--accent-d);border-radius:12px;text-decoration:none;font-weight:700;font-size:14px;margin-bottom:12px;}
  .d-map:active{box-shadow:var(--well);}
  .d-secttl{font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.06em;margin:18px 2px 9px;}
  .d-badges{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 4px;}
  .d-bdg{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;}
  .d-bdg.st{background:#dcf3e7;color:#176a40;} .d-bdg.kk{background:#e3ecfb;color:#1e50a0;} .d-bdg.term{background:#eceef2;color:var(--sub);font-weight:600;}
  .mapchips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;}
  .mchip{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:var(--ink);background:var(--bg);box-shadow:var(--rise-sm);border:none;border-radius:13px;padding:11px 12px;min-width:72px;}
  .mchip:active{box-shadow:var(--well);}
  .mchip .i{font-size:21px;} .mchip .t{font-size:11.5px;font-weight:700;}
  .mchip.big{padding:14px 16px;min-width:96px;} .mchip.big .i{font-size:28px;} .mchip.big .t{font-size:13px;}
  .mchip.small{padding:8px 9px;min-width:56px;} .mchip.small .i{font-size:16px;} .mchip.small .t{font-size:10px;}
  .ctc{display:flex;flex-direction:column;gap:8px;}
  .cbtn{display:flex;align-items:center;gap:10px;text-decoration:none;border-radius:12px;padding:13px 15px;font-weight:700;font-size:14.5px;border:none;background:var(--bg);color:var(--ink);box-shadow:var(--rise-sm);cursor:pointer;font-family:inherit;}
  .cbtn:active{box-shadow:var(--well);}
  .cbtn .ci{font-size:18px;display:inline-flex;align-items:center;}
  .cbtn .ci svg{width:18px;height:18px;}
  .cbtn.lw{background:#00b900;color:#fff;box-shadow:2px 3px 9px rgba(0,185,0,.32);} .cbtn.fol{background:#3b82f6;color:#fff;box-shadow:2px 3px 9px rgba(59,130,246,.32);} .cbtn.share{background:#2563eb;color:#fff;box-shadow:2px 3px 9px rgba(37,99,235,.32);}
  .fmenu{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;}
  .fitem{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--ink);background:var(--bg);box-shadow:var(--rise-sm);border:none;border-radius:14px;padding:13px 4px 11px;cursor:pointer;}
  .fitem:active{box-shadow:var(--well);}
  .fitem .fi{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;box-shadow:2px 2px 6px rgba(40,60,100,.18);}
  .fitem .fi svg{width:21px;height:21px;}
  .fitem .ft{font-size:11px;font-weight:700;text-align:center;line-height:1.3;}
  .fc1{background:#5b6b8c;} .fc2{background:#2d7dd2;} .fc3{background:#e8910b;} .fc4{background:#d2566b;}
  .fc5{background:#22a06b;} .fc6{background:#7c6ce0;} .fc7{background:#0d9aa0;} .fc8{background:#0f766e;}
  .fitem.fempty .fi{background:#dfe4ea !important;color:#aab2bf;box-shadow:none;}
  .fitem.fempty .ft{color:#aab2bf;}
  .d-btns{display:flex;gap:8px;}
  .d-btns .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;text-align:center;}
  .fab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 16px);z-index:30;background:var(--accent);color:#fff;border:none;border-radius:999px;padding:14px 21px;font-size:15px;font-weight:800;box-shadow:5px 6px 16px rgba(91,91,214,.45),-3px -3px 8px #ffffff;cursor:pointer;}
  .fab:active{transform:translateY(1px);}
  .ov{position:fixed;inset:0;background:rgba(15,23,40,.45);z-index:40;display:none;align-items:flex-end;justify-content:center;}
  .ov.show{display:flex;}
  .sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);box-shadow:0 -10px 30px rgba(20,30,50,.2);}
  .sheet h2{font-size:16.5px;margin:2px 0 12px;color:var(--ink);}
  .fld{margin-bottom:11px;}
  .fld label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:4px;font-weight:700;}
  .fld input,.fld select,.fld textarea{width:100%;padding:11px 12px;border:none;border-radius:10px;font-size:15.5px;background:var(--bg);box-shadow:var(--well);color:var(--ink);font-family:inherit;}
  .fld textarea{resize:vertical;min-height:54px;}
  .two{display:flex;gap:8px;} .two>.fld{flex:1;}
  /* 工程管理（Step2） */
  .klist{display:flex;flex-direction:column;gap:8px;}
  .krow{background:var(--bg);border-radius:12px;padding:10px 12px;box-shadow:var(--rise-sm);cursor:pointer;}
  .krow:active{box-shadow:var(--well);}
  .krow-h{display:flex;align-items:center;gap:7px;}
  .kname{font-size:14.5px;font-weight:700;color:var(--ink);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ktag{font-size:10.5px;font-weight:700;color:var(--accent-d);background:rgba(91,91,214,.10);border-radius:999px;padding:2px 8px;white-space:nowrap;}
  .kpg{font-size:12.5px;font-weight:800;color:var(--accent-d);}
  .kperiod{font-size:12px;color:var(--sub);margin:3px 0 6px;}
  .gaxis{position:relative;height:15px;margin:2px 0 7px;font-size:10.5px;color:var(--sub);}
  .gaxis .gx-min{position:absolute;left:0;} .gaxis .gx-max{position:absolute;right:0;}
  .gaxis .gx-today{position:absolute;transform:translateX(-50%);color:#e0512f;font-weight:800;white-space:nowrap;}
  .gtrack{position:relative;height:16px;border-radius:6px;background:rgba(0,0,0,.05);overflow:hidden;margin-top:3px;}
  .gbar{position:absolute;top:2px;bottom:2px;border-radius:6px;background:rgba(91,91,214,.22);overflow:hidden;min-width:6px;}
  .gbar-nodate{background:rgba(0,0,0,.06);}
  .gbar-fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:6px;}
  .gtoday{position:absolute;top:0;bottom:0;width:2px;background:#e0512f;z-index:2;}
  .knodate{font-size:10px;color:#b45309;background:rgba(245,158,11,.13);border-radius:6px;padding:1px 6px;margin-left:4px;}
  .kdelay{font-size:10px;color:#fff;background:#c0392b;border-radius:6px;padding:1px 6px;margin-left:4px;font-weight:700;}
  .kmove{display:inline-flex;gap:3px;margin-left:2px;}
  .kmv{border:none;background:var(--bg);box-shadow:var(--rise-sm);border-radius:7px;width:25px;height:22px;font-size:10px;line-height:1;color:var(--sub);cursor:pointer;padding:0;}
  .kmv:active{box-shadow:var(--well);} .kmv:disabled{opacity:.35;box-shadow:none;cursor:default;}
  .kexport{display:flex;gap:8px;margin-top:10px;}
  .ytip{display:flex;gap:6px;align-items:flex-end;}
  .ytip .mini{flex:0 0 auto;padding:10px;border:none;border-radius:10px;background:var(--bg);box-shadow:var(--rise-sm);font-size:12px;cursor:pointer;color:var(--accent-d);font-weight:700;}
  .ytip .mini:active{box-shadow:var(--well);}
  .acts{display:flex;gap:8px;margin-top:6px;}
  .btn{flex:1;padding:13px;border-radius:12px;border:none;font-size:15px;font-weight:800;cursor:pointer;}
  .btn.primary{background:var(--accent);color:#fff;box-shadow:3px 4px 10px rgba(91,91,214,.4),-2px -2px 6px #ffffff;} .btn.primary:active{transform:translateY(1px);}
  .btn.sub{background:var(--bg);box-shadow:var(--rise-sm);color:var(--sub);} .btn.sub:active{box-shadow:var(--well);}
  .btn.danger{background:var(--bg);box-shadow:var(--rise-sm);color:#dc2626;}
  .row-del{text-align:center;margin-top:10px;}
  .row-del a{color:#dc2626;font-size:13px;text-decoration:none;}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;z-index:60;background:#1f2733;color:#fff;padding:11px 17px;border-radius:999px;font-size:13.5px;opacity:0;transition:opacity .25s;pointer-events:none;box-shadow:0 8px 20px rgba(31,39,51,.3);}
  .toast.show{opacity:1;}
  .ov.detail{align-items:stretch;}
  .ov.detail .sheet{max-width:none;width:100%;max-height:100%;height:100%;border-radius:0;padding:0;display:flex;flex-direction:column;overflow:hidden;}
  .dhead{position:sticky;top:0;flex:0 0 auto;background:var(--accent);color:#fff;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 11px) 12px 11px;box-shadow:0 3px 10px rgba(68,68,184,.35);}
  .dhead .dclose{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:9px;padding:7px 12px;font-size:14px;font-weight:700;cursor:pointer;}
  .dhead .dttl{font-size:15px;font-weight:700;letter-spacing:.02em;}
  .dbody{flex:1;overflow:auto;padding:18px 16px calc(env(safe-area-inset-bottom) + 28px);max-width:560px;width:100%;margin:0 auto;}
  .d-folder{display:block;text-align:center;padding:14px;background:var(--accent);color:#fff;border-radius:12px;text-decoration:none;font-weight:800;font-size:15px;margin-bottom:12px;box-shadow:3px 4px 11px rgba(91,91,214,.35);}
  .d-folder:active{transform:translateY(1px);}
  .d-memo{width:100%;background:#1f9d57;color:#fff;border:none;border-radius:12px;padding:13px;font-family:inherit;font-size:14.5px;font-weight:800;cursor:pointer;margin-bottom:12px;box-shadow:3px 4px 11px rgba(31,157,87,.32);}
  .d-memo:active{transform:translateY(1px);}
  .dnote-ttl{font-size:13px;font-weight:700;color:var(--ink);margin:16px 0 8px;}
  .dnote-load,.dnote-empty{font-size:13px;color:var(--sub);padding:4px 0 8px;}
  .dnote{background:var(--bg);box-shadow:var(--rise-sm);border:none;border-radius:12px;padding:11px 13px;margin-bottom:8px;cursor:pointer;}
  .dnote:active{box-shadow:var(--well);}
  .dnote-t{font-weight:700;font-size:14px;color:var(--ink);display:flex;align-items:center;}
  .dnote-p{font-size:12px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dcheck .dnote-t{color:#1e50a0;}
  .ddraw .dnote-t{color:#9a6a00;}
  .d-rows .v a{color:var(--accent-d);text-decoration:none;font-weight:600;}
  .adhint{font-size:12.5px;color:var(--sub);background:var(--bg);box-shadow:var(--well-soft);border:none;border-radius:11px;padding:10px 12px;}
  .loading{position:fixed;inset:0;z-index:1000;background:rgba(232,236,242,.78);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;}
  .loading.show{display:flex;}
  .lbox{background:var(--bg);border-radius:18px;box-shadow:var(--rise);padding:24px 32px;text-align:center;}

<script>
/* ===== 設定・認証（projectsと共通方式） ===== */
var GAS_URL=(window.GENBA_CONFIG&&window.GENBA_CONFIG.GAS_URL)||'https://script.google.com/macros/s/AKfycbyk8p6_gi6e3wdhQdWL0Oswz4BUtP3gR37PeFJJ9rO5mVhTRt4CikpQhK_bBwt1Ftr-/exec';
var BASE=new URL('../',location.href).href;
function genbaSessionTok(){ try{ var s=JSON.parse(localStorage.getItem('genba_session')||'null'); if(s&&s.token&&(!s.expiresAt||Date.now()<Number(s.expiresAt)))return s.token; }catch(e){} return ''; }
function admTok(){ return localStorage.getItem('genba_admin')||''; }
function tok(){ return admTok()||genbaSessionTok(); }

/* ===== JSONP 通信 ===== */
var loadCnt=0,loadShownAt=0,loadTmr=null;
function showLoad(){loadCnt++;if(loadCnt===1){loadShownAt=Date.now();clearTimeout(loadTmr);loadTmr=setTimeout(function(){if(loadCnt>0)document.getElementById('loading').classList.add('show');},150);}}
function hideLoad(){loadCnt=Math.max(0,loadCnt-1);if(loadCnt===0){clearTimeout(loadTmr);document.getElementById('loading').classList.remove('show');}}
function callGAS(params,secretOverride,silent){
  return new Promise(function(resolve,reject){
    if(!GAS_URL){ reject(new Error('GAS_URL が未設定です')); return; }
    if(!silent) showLoad();
    var cb='cb_'+Date.now()+'_'+Math.floor(Math.random()*1e6);
    var s=document.createElement('script');
    var timer=setTimeout(function(){cleanup();reject(new Error('タイムアウト'));},20000);
    function cleanup(){if(!silent) hideLoad();try{delete window[cb];}catch(e){}if(s.parentNode)s.parentNode.removeChild(s);clearTimeout(timer);}
    window[cb]=function(res){cleanup();resolve(res);};
    var q=Object.assign({secret:secretOverride||tok(),callback:cb},params);
    if(q.data && typeof q.data!=='string') q.data=JSON.stringify(q.data);
    var url=GAS_URL+'?'+Object.keys(q).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(q[k]);}).join('&');
    s.src=url; s.onerror=function(){cleanup();reject(new Error('通信エラー'));};
    document.head.appendChild(s);
  });
}

/* ===== 共通ヘルパー ===== */
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
var toastT;
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show');},2600);}
function dateOnly(v){return v?String(v).slice(0,10):'';}
function parseYmd(v){if(!v)return null;var t=String(v).slice(0,10).replace(/\//g,'-');var d=new Date(t+'T00:00:00');return isNaN(d.getTime())?null:d;}
function fmtMd(d){ return (d.getMonth()+1)+'/'+d.getDate(); }
function hexA(hex,a){ var n=parseInt(String(hex).slice(1),16); return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')'; }

/* ===== 横断工程表 ===== */
var STATUSES=['見積中','受注','段取済','施工中','完了','請求済'];
var SCOLOR={'見積中':'#e0a800','受注':'#3b82f6','段取済':'#8b5cf6','施工中':'#16a085','完了':'#6b7280','請求済':'#9ca3af'};
var KP=[], filterStatus='すべて';
var REPORTS=[], repIndex={};
function statusColor(s){ return SCOLOR[String(s||'').trim()]||'#5b6b8c'; }
function pname(p){ return p['現場名']||p['案件名']||'(無題)'; }
function visibleProjects(){ return KP.filter(function(p){ return filterStatus==='すべて' || String(p['ステータス']||'').trim()===filterStatus; }); }
function setFilter(s){ filterStatus=s; render(); }
function openCase(id){ location.href=BASE+'projects/?case='+encodeURIComponent(id); }

function buildChips(){
  var wrap=document.getElementById('chips'); if(!wrap)return;
  var counts={}; KP.forEach(function(p){var s=String(p['ステータス']||'').trim(); counts[s]=(counts[s]||0)+1;});
  var all=['すべて'].concat(STATUSES);
  wrap.innerHTML=all.map(function(s){
    var n=(s==='すべて')?KP.length:(counts[s]||0);
    return '<button class="chip'+(s===filterStatus?' active':'')+'" onclick="setFilter(\''+s+'\')">'+esc(s)+' '+n+'</button>';
  }).join('');
}
var DAYPX=null, ZMIN=18, ZMAX=120, ZDEFAULT=44;
function curLabelW(){ return (window.innerWidth<=560)?124:172; }

function render(opt){
  var box=document.getElementById('list');
  var items=visibleProjects();
  if(!items.length){ box.innerHTML='<div class="empty">該当する現場がありません。</div>'; return; }
  var DAY=86400000, WD=['日','月','火','水','木','金','土'];
  var dated=[], undated=[];
  items.forEach(function(p){ var s=parseYmd(p['工期開始']),e=parseYmd(p['工期完了']); if(s&&e&&e>=s){p.__s=s;p.__e=e;dated.push(p);} else {undated.push(p);} });
  var h='', todayOff=-1, labelw=curLabelW(), dpx=ZDEFAULT;
  if(dated.length){
    dated.sort(function(a,b){return a.__s-b.__s;});
    var minD=dated[0].__s, maxD=dated[0].__e;
    dated.forEach(function(p){
      if(p.__s<minD)minD=p.__s; if(p.__e>maxD)maxD=p.__e;
      var wd=repIndex[String(p['案件ID'])];
      if(wd){ Object.keys(wd).forEach(function(ymd){ var d=parseYmd(ymd); if(d){ if(d<minD)minD=d; if(d>maxD)maxD=d; } }); }
    });
    var rangeStart=new Date(minD.getFullYear(),minD.getMonth(),1);
    var rangeEnd=new Date(maxD.getFullYear(),maxD.getMonth()+1,0);
    var totalDays=Math.round((rangeEnd-rangeStart)/DAY)+1;
    if(DAYPX==null){ var avail=(box.clientWidth||760)-labelw-2; if(avail<140)avail=140; DAYPX=Math.max(ZDEFAULT, avail/totalDays); if(DAYPX>ZMAX)DAYPX=ZMAX; if(DAYPX<ZMIN)DAYPX=ZMIN; DAYPX=Math.round(DAYPX*10)/10; }
    dpx=DAYPX;
    var today=new Date();today.setHours(0,0,0,0);
    var inRange=(today>=rangeStart&&today<=rangeEnd);
    todayOff=inRange?Math.round((today-rangeStart)/DAY):-1;
    var timeW=Math.round(totalDays*dpx);
    var monHtml='', cur=new Date(rangeStart);
    while(cur<=rangeEnd){
      var mEnd=new Date(cur.getFullYear(),cur.getMonth()+1,0);
      var upto=(mEnd<rangeEnd)?mEnd:rangeEnd;
      var dim=Math.round((upto-cur)/DAY)+1;
      monHtml+='<div class="gmon" style="width:'+Math.round(dim*dpx)+'px">'+(cur.getMonth()+1)+'月</div>';
      cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);
    }
    var dayHtml='';
    for(var i=0;i<totalDays;i++){
      var d=new Date(rangeStart.getTime()+i*DAY), w=d.getDay();
      dayHtml+='<div class="gday'+(w===0?' sun':'')+(w===6?' sat':'')+(i===todayOff?' today':'')+'" style="width:'+dpx+'px"><span class="dn">'+d.getDate()+'</span><span class="wd">'+WD[w]+'</span></div>';
    }
    var grad='repeating-linear-gradient(to right,rgba(0,0,0,.05) 0,rgba(0,0,0,.05) 1px,transparent 1px,transparent '+dpx+'px)';
    var todayLine=inRange?'<div class="gtodayline" style="left:'+(todayOff*dpx+dpx/2)+'px"></div>':'';
    var startY=rangeStart.getFullYear(), endY=rangeEnd.getFullYear();
    var yLabel=(startY===endY)?startY+'年':startY+'–'+endY;
    h+='<div class="gwrap"><div class="ginner">';
    h+='<div class="grow ghead"><div class="glabel ghl"><span class="gyr">'+yLabel+'</span><span class="gsub">現場 / 工期</span></div><div class="gtime" style="width:'+timeW+'px"><div class="gmonrow">'+monHtml+'</div><div class="gdayrow">'+dayHtml+'</div></div></div>';
    h+=dated.map(function(p){
      var col=statusColor(p['ステータス']);
      var off=Math.round((p.__s-rangeStart)/DAY), dur=Math.round((p.__e-p.__s)/DAY)+1;
      var left=Math.round(off*dpx), bw=Math.max(Math.round(dpx),Math.round(dur*dpx));
      var period=fmtMd(p.__s)+'〜'+fmtMd(p.__e);
      var pid=esc(String(p['案件ID']));
      var bar='<div class="gbar2" style="left:'+left+'px;width:'+bw+'px;background:'+hexA(col,0.16)+';border-color:'+hexA(col,0.42)+'"></div>';
      var work='';
      var wd=repIndex[String(p['案件ID'])];
      if(wd){
        Object.keys(wd).forEach(function(ymd){
          var d=parseYmd(ymd); if(!d)return;
          var wo=Math.round((d-rangeStart)/DAY); if(wo<0||wo>=totalDays)return;
          work+='<div class="gwork" style="left:'+Math.round(wo*dpx)+'px;width:'+Math.round(dpx)+'px;background:'+col+'" onclick="showDay(\''+pid+'\',\''+ymd+'\')" title="'+ymd+' の作業内容・人員"></div>';
        });
      }
      return '<div class="grow data">'
        +'<div class="glabel lck" onclick="openCase(\''+pid+'\')" title="現場の詳細（工程管理）を開く"><div class="gname">'+esc(pname(p))+' ›</div><div class="gmeta"><span class="gtag" style="background:'+hexA(col,0.15)+';color:'+col+'">'+esc(String(p['ステータス']||''))+'</span><span class="gper">'+esc(period)+'</span></div></div>'
        +'<div class="gtime" style="width:'+timeW+'px;background-image:'+grad+'"><div class="gtrack2">'+todayLine+bar+work+'</div></div>'
        +'</div>';
    }).join('');
    h+='</div></div>';
  }
  if(undated.length){
    h+='<div class="d-secttl" style="margin-top:16px;">工期未設定</div>';
    h+='<div class="klist gundated">'+undated.map(function(p){
      var col=statusColor(p['ステータス']); var pid=esc(String(p['案件ID']));
      return '<div class="krow" onclick="openCase(\''+pid+'\')">'
        +'<div class="krow-h"><span class="kname">'+esc(pname(p))+'</span><span class="ktag" style="background:'+hexA(col,0.14)+';color:'+col+'">'+esc(String(p['ステータス']||''))+'</span></div>'
        +'<div class="kperiod">工期が未設定です</div></div>';
    }).join('')+'</div>';
  }
  box.innerHTML=h;
  var gw=box.querySelector('.gwrap');
  if(gw){
    attachGanttZoom(gw);
    if(opt && opt.dayFloat!=null && opt.cx!=null){
      gw.scrollLeft=Math.max(0, Math.round(labelw + opt.dayFloat*dpx - opt.cx));
    } else if(opt && opt.keepScroll!=null){
      gw.scrollLeft=opt.keepScroll;
    } else if(todayOff>=0){
      gw.scrollLeft=Math.max(0, Math.round(todayOff*dpx+dpx/2-(gw.clientWidth-labelw)/2));
    }
  }
}

/* ===== ズーム（ホイール／ピンチ／± ボタン） ===== */
function clampZoom(v){ return Math.max(ZMIN,Math.min(ZMAX,v)); }
var _zr=false,_zd,_zcx;
function zoomThrottled(dpx,cx){ _zd=dpx; _zcx=cx; if(!_zr){ _zr=true; requestAnimationFrame(function(){ _zr=false; zoomApply(_zd,_zcx); }); } }
function zoomApply(newDpx,cx){
  newDpx=clampZoom(newDpx);
  if(DAYPX==null) DAYPX=ZDEFAULT;
  if(Math.abs(newDpx-DAYPX)<0.05) return;
  var gw=document.querySelector('.gwrap');
  var labelw=curLabelW();
  if(!gw){ DAYPX=newDpx; render(); return; }
  var localOld=(cx - labelw) + gw.scrollLeft; if(localOld<0) localOld=0;
  var dayFloat=localOld/DAYPX;
  DAYPX=newDpx;
  render({dayFloat:dayFloat, cx:cx});
}
function zoomBtn(f){ var gw=document.querySelector('.gwrap'); var labelw=curLabelW(); var cx=gw?(labelw+(gw.clientWidth-labelw)/2):(labelw+150); zoomApply((DAYPX||ZDEFAULT)*f, cx); }
function attachGanttZoom(gw){
  gw.addEventListener('wheel', function(e){
    e.preventDefault();
    var rect=gw.getBoundingClientRect(); var cx=e.clientX-rect.left;
    var factor=Math.exp(-(e.deltaY)*0.0015);
    zoomThrottled((DAYPX||ZDEFAULT)*factor, cx);
  }, {passive:false});
  var pd=0, pdpx=0;
  function dist(t){var dx=t[0].clientX-t[1].clientX,dy=t[0].clientY-t[1].clientY;return Math.sqrt(dx*dx+dy*dy);}
  gw.addEventListener('touchstart', function(e){ if(e.touches.length===2){ pd=dist(e.touches); pdpx=(DAYPX||ZDEFAULT); } }, {passive:false});
  gw.addEventListener('touchmove', function(e){ if(e.touches.length===2 && pd>0){ e.preventDefault(); var d=dist(e.touches); var rect=gw.getBoundingClientRect(); var cx=((e.touches[0].clientX+e.touches[1].clientX)/2)-rect.left; zoomThrottled(pdpx*(d/pd), cx); } }, {passive:false});
  gw.addEventListener('touchend', function(e){ if(e.touches.length<2) pd=0; }, {passive:false});
}
function buildRepIndex(){
  repIndex={};
  REPORTS.forEach(function(r){
    var pid=String(r['案件ID']||''); if(!pid) return;
    var ymd=String(r['日付']||'').slice(0,10).replace(/\//g,'-'); if(!/^\d{4}-\d{2}-\d{2}$/.test(ymd)) return;
    if(!repIndex[pid]) repIndex[pid]={};
    if(!repIndex[pid][ymd]) repIndex[pid][ymd]=[];
    repIndex[pid][ymd].push(r);
  });
}
function showDay(pid, ymd){
  var rows=(repIndex[pid]&&repIndex[pid][ymd])?repIndex[pid][ymd]:[];
  var proj=KP.filter(function(p){return String(p['案件ID'])===String(pid);})[0];
  var pn=proj?pname(proj):'';
  var names=[]; rows.forEach(function(r){ var nm=String(r['氏名']||'').trim(); if(nm&&names.indexOf(nm)<0)names.push(nm); });
  var works=rows.map(function(r){ return {nm:String(r['氏名']||'').trim(), w:(String(r['作業内容']||'').trim()||'（記載なし）')}; });
  var d=parseYmd(ymd), WD=['日','月','火','水','木','金','土'];
  var dlabel=d?((d.getMonth()+1)+'月'+d.getDate()+'日（'+WD[d.getDay()]+'）'):esc(ymd);
  var html='<div class="dp-ttl">'+dlabel+'</div>'
    +'<div class="dp-sub">'+esc(pn)+'</div>'
    +'<div class="dp-sec">人員（'+names.length+'名）</div>'
    +'<div class="dp-names">'+(names.length?names.map(function(n){return '<span class="dp-chip">'+esc(n)+'</span>';}).join(''):'<span class="dp-empty">記録なし</span>')+'</div>'
    +'<div class="dp-sec">作業内容</div>'
    +'<div class="dp-works">'+(works.length?works.map(function(o){return '<div class="dp-wk"><span class="dp-wknm">'+esc(o.nm||'—')+'</span><span class="dp-wktx">'+esc(o.w)+'</span></div>';}).join(''):'<div class="dp-empty">記録なし</div>')+'</div>';
  document.getElementById('dpBody').innerHTML=html;
  document.getElementById('dayPop').classList.add('show');
}
function closeDayPop(){ document.getElementById('dayPop').classList.remove('show'); }

function load(){
  try{ KP=JSON.parse(localStorage.getItem('genba_projects')||'[]'); if(KP.length){ normKP(); } }catch(e){}
  try{ REPORTS=JSON.parse(localStorage.getItem('genba_reports')||'[]'); if(REPORTS.length) buildRepIndex(); }catch(e){}
  if(KP.length) render();
  callGAS({action:'all'},null,KP.length>0).then(function(res){
    if(!res||!res.ok){ if(!KP.length){ document.getElementById('list').innerHTML='<div class="empty">読み込みに失敗しました。ログインが必要かもしれません。<br><a href="'+BASE+'">メニューへ戻る</a></div>'; }else{ toast('更新に失敗しました。ログインが切れている可能性があります'); } return; }
    KP=res.projects||[]; normKP();
    try{localStorage.setItem('genba_projects',JSON.stringify(KP));}catch(e){}
    render();
    loadReports();
  }).catch(function(e){
    if(!KP.length) document.getElementById('list').innerHTML='<div class="empty">オフライン、または読み込みに失敗しました。<br><a href="'+BASE+'">メニューへ戻る</a></div>';
  });
}
function loadReports(){
  callGAS({action:'reports'},null,true).then(function(res){
    if(res&&res.ok&&res.reports){ REPORTS=res.reports; buildRepIndex(); try{localStorage.setItem('genba_reports',JSON.stringify(REPORTS));}catch(e){} render(); }
  }).catch(function(){});
}
function normKP(){ KP.forEach(function(p){ if(String(p['ステータス']||'').trim()==='進行中') p['ステータス']='施工中'; }); }
window.addEventListener('DOMContentLoaded', load);
</script>
