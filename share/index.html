<!DOCTYPE html>
<!-- share v43.17.0 (2026-07-04) デザイン統一第2弾：配色を全画面共通トークン（青 #2d7dd2・紺文字 #1f3a52）に統一。状態色・入口アイコンの色分けは据え置き。GAS変更なし。 -->
<!-- version 3 share (2026-06-14) ヘッダー統一の一環でGen-Canバナーを中央寄せ（少し大きく）。顧客ページのため戻る/更新ボタンは付けない（B）。機能・id不変 -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>工事進捗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Montserrat:ital,wght@1,900&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e8ecf2;--ink:#1f3a52;--sub:#5e7a92;--line:#dbe2ea;
    --accent:#2d7dd2;--accent-d:#1f5fa8;--accent-soft:#e3f0fb;
    --radius:14px;
    --grad:linear-gradient(120deg,#06b6d4 8%,#2563eb 55%,#7c3aed 95%);
    --rise:6px 6px 12px #cdd3dc,-6px -6px 12px #ffffff;
    --rise-sm:4px 4px 8px #cdd3dc,-4px -4px 8px #ffffff;
    --well:inset 3px 3px 6px #cdd3dc,inset -3px -3px 6px #ffffff;
    --well-soft:inset 2px 2px 5px #d3d9e1,inset -2px -2px 5px #fbfdff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;font-size:15.5px;line-height:1.6;padding-bottom:40px;}
  header{background:var(--grad);color:#fff;padding:calc(env(safe-area-inset-top) + 20px) 18px 22px;box-shadow:0 8px 20px -10px rgba(37,99,235,.5);}
  header .hbrand{font-family:"Montserrat",sans-serif;font-weight:900;font-style:italic;font-size:13.5px;letter-spacing:.02em;color:rgba(255,255,255,.92);margin-bottom:12px;}
  header .co{font-size:12.5px;opacity:.92;letter-spacing:.04em;}
  header h1{font-size:21px;margin:6px 0 4px;font-weight:800;line-height:1.3;}
  header .place{font-size:13px;opacity:.95;}
  main{max-width:680px;margin:0 auto;padding:16px 14px;}
  .statusbar{display:flex;align-items:center;gap:10px;background:var(--bg);border:none;border-radius:var(--radius);box-shadow:var(--rise-sm);padding:14px 16px;margin-bottom:14px;}
  .statusbar .badge{flex:0 0 auto;font-size:13px;font-weight:800;padding:5px 14px;border-radius:999px;color:#fff;}
  .statusbar .term{font-size:13px;color:var(--sub);}
  .sec{font-size:13px;font-weight:800;color:var(--accent-d);margin:20px 4px 11px;letter-spacing:.04em;display:flex;align-items:center;gap:7px;}
  .sec svg{width:17px;height:17px;}
  .timeline{background:var(--bg);border:none;border-radius:var(--radius);box-shadow:var(--rise-sm);padding:6px 16px;}
  .tl{display:flex;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line);}
  .tl:last-child{border-bottom:none;}
  .tl .dot{flex:0 0 auto;width:11px;height:11px;border-radius:50%;background:var(--accent);margin-top:5px;position:relative;}
  .tl .dot.done{background:#16a34a;} .tl .dot.next{background:#ea580c;box-shadow:0 0 0 4px rgba(234,88,12,.15);}
  .tl .body{flex:1;min-width:0;}
  .tl .d{font-size:12.5px;color:var(--sub);font-variant-numeric:tabular-nums;}
  .tl .t{font-weight:700;font-size:14.5px;margin-top:1px;color:var(--ink);}
  .tl .k{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:7px;background:var(--accent-soft);color:var(--accent-d);margin-top:4px;}
  .photos{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
  .photos img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:11px;background:#dfe5ec;cursor:pointer;border:none;box-shadow:var(--rise-sm);}
  .empty{text-align:center;color:var(--sub);padding:26px 10px;font-size:13.5px;background:var(--bg);border:none;border-radius:var(--radius);box-shadow:var(--well-soft);}
  .foot{text-align:center;color:var(--sub);font-size:11.5px;margin-top:26px;line-height:1.7;}
  .powered{text-align:center;margin-top:10px;font-family:"Montserrat",sans-serif;font-weight:900;font-style:italic;font-size:12px;background-image:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;opacity:.85;}
  .center{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 24px;color:var(--sub);}
  .center .ic{margin-bottom:12px;}
  .center h2{font-size:17px;color:var(--ink);margin:0 0 6px;}
  .spin{width:38px;height:38px;border:4px solid #d6deea;border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;margin-bottom:14px;}
  @keyframes sp{to{transform:rotate(360deg)}}
  .lb{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:90;}
  .lb.on{display:flex;}
  .lb img{max-width:96vw;max-height:90vh;border-radius:8px;}
  .lb .x{position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:18px;color:#fff;font-size:30px;cursor:pointer;line-height:1;}
  /* v3: バナー中央寄せ（統一・更新/戻るなし） */
  header{text-align:center;}
  header .hbrand{font-size:14px;}
  header h1{font-size:22px;}
</style>
</head>
<body>
<div id="loadView" class="center"><div class="spin"></div><div>読み込み中…</div></div>
<div id="errView" class="center" style="display:none"><div class="ic"><svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#9aa3b2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.4"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/><circle cx="12" cy="15.4" r="1.3"/></svg></div><h2 id="errTtl">表示できません</h2><div id="errMsg"></div></div>

<div id="app" style="display:none">
  <header>
    <div class="hbrand">Gen-Can</div>
    <div class="co" id="coName"></div>
    <h1 id="pName"></h1>
    <div class="place" id="pPlace"></div>
  </header>
  <main>
    <div class="statusbar">
      <span class="badge" id="badge"></span>
      <span class="term" id="term"></span>
    </div>

    <div id="schedSec" style="display:none">
      <div class="sec"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M3.5 9.5h17M8 3.5v3M16 3.5v3"/></svg>工事の予定</div>
      <div class="timeline" id="timeline"></div>
    </div>

    <div id="photoSec" style="display:none">
      <div class="sec"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5a2 2 0 0 1 2-2h1.6l1.4-2h6l1.4 2H19a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><circle cx="12" cy="12.5" r="3.2"/></svg>現場の写真</div>
      <div class="photos" id="photos"></div>
    </div>

    <div class="foot" id="foot"></div>
    <div class="powered">Powered by Gen-Can</div>
  </main>
</div>

<div class="lb" id="lb" onclick="closeLb()"><span class="x">×</span><img id="lbImg" src="" alt=""></div>
<script src="../config.js?v=20260704-v43-20-0"></script>
<script>
var GAS_URL=(window.GENBA_CONFIG&&window.GENBA_CONFIG.GAS_URL)||'';

function genbaSessionTok(){
  try{
    var s=JSON.parse(localStorage.getItem('genba_session')||'null');
    if(s&&s.token&&(!s.expiresAt || Date.now()<Number(s.expiresAt)))return s.token;
  }catch(e){}
  return '';
}
function genbaSaveSession(res){
  try{
    if(res&&res.token)localStorage.setItem('genba_session',JSON.stringify({token:res.token,role:res.role||'general',expiresAt:res.expiresAt||0}));
  }catch(e){}
}
function genbaClearSession(){try{localStorage.removeItem('genba_session');localStorage.removeItem('genba_admin');}catch(e){}}
function esc(s){return(s==null?'':String(s)).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function qp(k){var m=new RegExp('[?&]'+k+'=([^&]+)').exec(location.search);return m?decodeURIComponent(m[1]):'';}
function statusColor(s){var m={'見積中':'#6b7280','受注':'#2563eb','段取済':'#9333ea','施工中':'#ea580c','完了':'#16a34a','請求済':'#7c3aed'};return m[s]||'#6b7280';}
function showErr(ttl,msg){
  document.getElementById('loadView').style.display='none';
  document.getElementById('app').style.display='none';
  document.getElementById('errView').style.display='flex';
  document.getElementById('errTtl').textContent=ttl;
  document.getElementById('errMsg').textContent=msg||'';
}
function jsonp(params){return new Promise(function(resolve,reject){
  var cb='cb_'+Date.now()+'_'+Math.floor(Math.random()*1e6),sc=document.createElement('script');
  var timer=setTimeout(function(){cleanup();reject(new Error('タイムアウト'));},25000);
  function cleanup(){try{delete window[cb];}catch(e){}if(sc.parentNode)sc.parentNode.removeChild(sc);clearTimeout(timer);}
  window[cb]=function(res){cleanup();resolve(res);};
  var q=Object.assign({callback:cb},params);
  sc.src=GAS_URL+'?'+Object.keys(q).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(q[k]);}).join('&');
  sc.onerror=function(){cleanup();reject(new Error('通信エラー'));};document.head.appendChild(sc);
});}
function todayS(){var d=new Date(),p=function(n){return('0'+n).slice(-2);};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function render(d){
  var p=d.project||{};
  document.getElementById('loadView').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('coName').textContent=d.company||'';
  document.getElementById('pName').textContent=p.name||'工事';
  document.getElementById('pPlace').textContent=p.place||'';
  var b=document.getElementById('badge');b.textContent=p.status||'進行中';b.style.background=statusColor(p.status);
  var term=(p.start||'')+(p.end?' 〜 '+p.end:'');
  document.getElementById('term').textContent=term?('工期 '+term):'';
  document.title=(p.name||'工事')+' 進捗';
  // 工程
  var scs=d.schedules||[],tl=document.getElementById('timeline'),tdy=todayS();
  if(scs.length){
    document.getElementById('schedSec').style.display='block';
    tl.innerHTML=scs.map(function(s){
      var done=s.date&&s.date<tdy, isToday=s.date===tdy;
      var cls=done?'done':(isToday?'next':'');
      var dt=s.date?(s.date.slice(5).replace('-','/')):'';
      if(s.end&&s.end!==s.date)dt+='〜'+s.end.slice(5).replace('-','/');
      var tm=s.st?(s.st+(s.et?'〜'+s.et:'')):'';
      return '<div class="tl"><div class="dot '+cls+'"></div><div class="body">'
        +'<div class="d">'+esc(dt)+(tm?'　'+esc(tm):'')+'</div>'
        +'<div class="t">'+esc(s.title)+'</div>'
        +(s.kubun?'<span class="k">'+esc(s.kubun)+'</span>':'')+'</div></div>';
    }).join('');
  }
  // 写真
  var phs=d.photos||[],pg=document.getElementById('photos');
  if(phs.length){
    document.getElementById('photoSec').style.display='block';
    pg.innerHTML=phs.map(function(x){return '<img loading="lazy" src="'+esc(x.thumb)+'" onclick="openLb(this.src)" alt="現場写真">';}).join('');
  }
  document.getElementById('foot').textContent='この画面は '+(d.company||'')+' が工事の進捗をお知らせするためのものです。';
}
function openLb(src){var big=src.replace(/sz=w\d+/,'sz=w2000');document.getElementById('lbImg').src=big;document.getElementById('lb').classList.add('on');}
function closeLb(){document.getElementById('lb').classList.remove('on');document.getElementById('lbImg').src='';}

(function(){
  var token=qp('t')||qp('token');
  if(!token){showErr('リンクが正しくありません','お手数ですが、お送りしたURLをもう一度ご確認ください。');return;}
  jsonp({action:'shareView',token:token}).then(function(res){
    if(res&&res.ok)render(res);
    else showErr('表示できません',(res&&res.error)||'このリンクは無効か、公開が停止されています。');
  }).catch(function(e){showErr('読み込みに失敗しました','通信状況をご確認のうえ、再度お試しください。');});
})();
</script>
<script src="../common_ui.js?v=20260704-v43-20-0"></script>
</body>
</html>
