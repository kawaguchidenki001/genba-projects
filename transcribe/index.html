<style>
  :root{

  .hric svg{width:23px;height:23px;}
  .htxt{flex:0 1 auto;min-width:0;text-align:center;}
  .htxt .en{font-family:"Manrope",sans-serif;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--sub);display:block;}

  main{padding:14px;max-width:680px;margin:0 auto;}

  /* 録音ボタン（大きく目立つ） */
  .rec-wrap{display:flex;flex-direction:column;align-items:center;margin:8px 0 16px;}
  .rec-btn{width:118px;height:118px;border-radius:50%;border:none;background:var(--bg);box-shadow:var(--rise);color:var(--accent);display:flex;align-items:center;justify-content:center;cursor:pointer;}

  .unsupported.show{display:block;}

<script>
/* ========== 設定 ========== */
var API_URL=(window.GENBA_CONFIG&&window.GENBA_CONFIG.GAS_URL)||'https://script.google.com/macros/s/AKfycbyk8p6_gi6e3wdhQdWL0Oswz4BUtP3gR37PeFJJ9rO5mVhTRt4CikpQhK_bBwt1Ftr-/exec';
var SECRET='';
var CACHE_KEY='genba_transcribe_memo';
/* v43.10.1: genbaSessionTok未定義で「整える／要約」が必ず失敗していたバグを修正（他ページと同じ定義を追加） */
function genbaSessionTok(){
  try{
    var s=JSON.parse(localStorage.getItem('genba_session')||'null');
    if(s&&s.token&&(!s.expiresAt || Date.now()<Number(s.expiresAt)))return s.token;
  }catch(e){}
  return '';
}

/* ========== 要素 ========== */
var memo=document.getElementById('memo');
var recBtn=document.getElementById('recBtn');
var recState=document.getElementById('recState');
var charCnt=document.getElementById('charCnt');
var errBar=document.getElementById('errBar');
var btnUndo=document.getElementById('btnUndo');
var unsupportedNote=document.getElementById('unsupportedNote');

/* ========== 状態 ========== */
var undoStack=[]; // 直前の値スタック（AI整文の前など）

/* ========== 共通UI ========== */
var toastT;
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show');},2600);}
function showErr(m){if(!m){errBar.classList.remove('show');errBar.textContent='';return;}errBar.textContent=m;errBar.classList.add('show');}
function showBusy(lbl){document.getElementById('busyLbl').textContent=lbl||'AIで処理中…';document.getElementById('busy').classList.add('show');}
function hideBusy(){document.getElementById('busy').classList.remove('show');}
function updateCnt(){charCnt.textContent=(memo.value||'').length+' 文字';}

/* ========== ローカル保存（離脱・再訪に備える） ========== */
function saveLocal(){try{localStorage.setItem(CACHE_KEY,memo.value||'');}catch(e){}}
function loadLocal(){try{var v=localStorage.getItem(CACHE_KEY);if(v){memo.value=v;updateCnt();}}catch(e){}}
memo.addEventListener('input',function(){updateCnt();saveLocal();});
// 画面を開いたときは前回の内容を復元しない（戻る→再訪で空白から始める）
// 古い保存があれば削除して、次回も確実に空白で始まるようにする
try{ localStorage.removeItem(CACHE_KEY); }catch(e){}

/* ========== Undo（AI処理前に保存） ========== */
function pushUndo(){undoStack.push(memo.value||'');if(undoStack.length>10)undoStack.shift();btnUndo.disabled=false;}
function undoEdit(){if(!undoStack.length)return;memo.value=undoStack.pop();updateCnt();saveLocal();if(!undoStack.length)btnUndo.disabled=true;toast('元に戻しました');}

/* ========== クリア ========== */
function clearAll(){
  if(!memo.value){toast('メモは空です');return;}
  if(!confirm('メモをすべて消去しますか？'))return;
  pushUndo();
  memo.value='';updateCnt();saveLocal();
  toast('クリアしました');
}

/* ========== 音声認識（Web Speech API・継続録音） ========== */
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
var rec=null, recording=false, userStopped=false, baseText='', committedText='';
if(!SR){
  unsupportedNote.classList.add('show');
  recBtn.disabled=true;
  recBtn.style.opacity='.45';
  recBtn.style.cursor='not-allowed';
  recState.textContent='音声認識は非対応（文字入力は可能）';
}
function setRecUI(on){
  if(on){
    recBtn.classList.add('recording');
    recState.classList.add('on');
    recState.textContent='● 録音中…もう一度タップで停止';
  } else {
    recBtn.classList.remove('recording');
    recState.classList.remove('on');
    recState.textContent='タップして録音開始';
  }
}
function startRec(){
  if(!SR){toast('音声認識に非対応のブラウザです');return;}
  userStopped=false;
  // 録音開始時点のメモを「確定済みテキスト」の基準にする
  var existing = memo.value || '';
  committedText = existing ? (existing.replace(/\s+$/,'') + '\n') : '';
  startSession();
  recording=true; setRecUI(true); showErr('');
}
// 1回分の認識セッション（continuous=false＝単発）。終わったら自動再開する
// ※Android Chromeのcontinuous=trueは onend直前に過去結果を連結した余分なonresultが出るバグがあるため
//   単発認識を都度再起動する方式にして二重化を防ぐ
function startSession(){
  rec=new SR(); rec.lang='ja-JP'; rec.interimResults=true; rec.continuous=false;
  rec.onresult=function(e){
    var fin='', intr='';
    for(var i=0;i<e.results.length;i++){
      var t=e.results[i][0].transcript;
      if(e.results[i].isFinal) fin+=t; else intr+=t;
    }
    if(fin){
      committedText = committedText + fin;
      memo.value = committedText;
    } else {
      memo.value = committedText + intr;
    }
    updateCnt();
  };
  rec.onend=function(){
    if(!userStopped && recording){
      try{ startSession(); return; }catch(e){}
    }
    recording=false; setRecUI(false); saveLocal();
  };
  rec.onerror=function(e){
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){
      showErr('マイクの使用が許可されていません。ブラウザの設定をご確認ください。');
      userStopped=true; recording=false; setRecUI(false);
    } else if(e.error==='no-speech'){
      // 無音は無視（onendで自動再開される）
    } else if(e.error==='aborted'){
      // 再起動時のabortは無視
    } else {
      recording=false; setRecUI(false);
    }
  };
  try{ rec.start(); }catch(err){ /* 直後の再startは onend が拾う */ }
}
function stopRec(){ userStopped=true; if(rec){ try{rec.stop();}catch(e){} } }
recBtn.addEventListener('click',function(){
  if(recBtn.disabled) return;
  if(recording) stopRec(); else startRec();
});

/* ========== AI整文・要約（既存aiChat流用・JSONP） ========== */
function aiProcess(mode){
  var text=(memo.value||'').trim();
  if(!text){toast('メモが空です。先に文字を入れてください');return;}
  if(text.length>4000){
    if(!confirm('文字数が多いです（'+text.length+'文字）。AI処理に時間がかかります。続けますか？'))return;
  }
  var prompt='';
  if(mode==='refine'){
    prompt='次の文字起こしを、意味は変えずに「読みやすい日本語」に整えてください。話し言葉のクセ・言いよどみ・「えーと」「あの」などを取り除き、誤変換や聞き取りミスらしき箇所も自然な文に直してください。箇条書きが適切なら箇条書きに、文章が適切なら文章のまま整えてください。前置きや感想は不要。整えた本文だけを出力してください。\n\n--- 文字起こし ---\n'+text;
    showBusy('整文中…');
  } else if(mode==='summary'){
    prompt='次の文字起こしの要点を、見出しなし・箇条書きでまとめてください。重要な数字・日時・固有名詞は省略しないでください。前置きは不要。\n\n--- 文字起こし ---\n'+text;
    showBusy('要約中…');
  } else { return; }

  callAiChat(prompt).then(function(reply){
    hideBusy();
    if(!reply){ toast('AIから空の応答が返りました'); return; }
    pushUndo();
    memo.value = reply;
    updateCnt(); saveLocal();
    toast(mode==='refine'?'整えました':'要約しました');
  }).catch(function(err){
    hideBusy();
    showErr('AI処理に失敗しました：'+(err&&err.message||err||''));
  });
}

function callAiChat(userMsg){
  return new Promise(function(resolve,reject){
    var cb='cb_'+Date.now()+'_'+Math.floor(Math.random()*1e6);
    var sc=document.createElement('script');
    var done=false;
    function cleanup(){try{delete window[cb];}catch(e){}if(sc.parentNode)sc.parentNode.removeChild(sc);}
    var timer=setTimeout(function(){if(done)return;done=true;cleanup();reject(new Error('タイムアウト（60秒）'));},60000);
    window[cb]=function(res){
      if(done)return;done=true;clearTimeout(timer);cleanup();
      if(res && res.ok && (res.text||res.reply)){ resolve(res.text||res.reply); }
      else if(res && res.error){ reject(new Error(res.error)); }
      else { reject(new Error('応答が不正です')); }
    };
    sc.onerror=function(){if(done)return;done=true;clearTimeout(timer);cleanup();reject(new Error('通信エラー'));};
    // messagesは単発のuserメッセージ（履歴なし・systemはGAS側保持）
    var msgs=[{role:'user',content:userMsg}];
    var q='action=aiChat'
      +'&secret='+encodeURIComponent(genbaSessionTok())
      +'&messages='+encodeURIComponent(JSON.stringify(msgs))
      +'&callback='+encodeURIComponent(cb);
    var url=API_URL+'?'+q;
    if(url.length>7500){
      done=true;clearTimeout(timer);cleanup();
      reject(new Error('文章が長すぎます。短くしてから試してください'));
      return;
    }
    sc.src=url;
    document.head.appendChild(sc);
  });
}

/* ========== 送信先 ========== */
function getText(){
  var t=(memo.value||'').trim();
  if(!t){toast('メモが空です');return null;}
  return t;
}
function doCopy(){
  var t=getText(); if(!t)return;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){toast('コピーしました');},function(){fallbackCopy(t);});
  } else { fallbackCopy(t); }
}
function fallbackCopy(t){
  try{
    var ta=document.createElement('textarea');
    ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast('コピーしました');
  }catch(e){ toast('コピーに失敗しました。長押しでコピーしてください'); }
}
function doLine(){
  var t=getText(); if(!t)return;
  // LINEは内容パラメータを直接渡せない（公式仕様）。URLを共有するLINE共有スキームは使えるが、
  // 任意テキストの確実な転送は「コピー→LINE起動」が最も安定
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(openLine,openLine);
  } else { fallbackCopy(t); openLine(); }
}
function openLine(){
  toast('コピー済み。LINEを開きます');
  // LINEアプリスキーム→失敗時はLINE公式サイトを開く
  setTimeout(function(){
    var t1=Date.now();
    location.href='line://';
    setTimeout(function(){
      // 戻ってきた場合（=アプリ起動失敗）はブラウザでLINEを開く
      if(Date.now()-t1<1500 && !document.hidden){
        window.open('https://line.me/','_blank');
      }
    },1200);
  },400);
}
function doMail(){
  var t=getText(); if(!t)return;
  var body=encodeURIComponent(t);
  var subj=encodeURIComponent('文字起こしメモ');
  // mailto:はOSの規定メールアプリ（Gmail/メール/Outlook等）を起動
  location.href='mailto:?subject='+subj+'&body='+body;
}
function doSms(){
  var t=getText(); if(!t)return;
  var body=encodeURIComponent(t);
  // iOS/Androidでmessage本文を渡す方式（端末の標準SMSアプリが起動）
  var ua=navigator.userAgent||'';
  // iOSとAndroidで?body=と&body=の扱いに微妙な差があるためどちらでも動く形に
  var url=/iPhone|iPad|iPod/.test(ua) ? 'sms:&body='+body : 'sms:?body='+body;
  location.href=url;
}

updateCnt();
</script>
