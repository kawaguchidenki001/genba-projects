<script>var GAS_URL=(window.GENBA_CONFIG&&window.GENBA_CONFIG.GAS_URL)||'';var APP_VERSION=(window.GENBA_CONFIG&&window.GENBA_CONFIG.APP_VERSION)||'v2026.06.20-43.9.3';var BUILD_ID=(window.GENBA_CONFIG&&window.GENBA_CONFIG.BUILD)||'20260620-v43-8-3-cache-lock';document.getElementById('appBadge').textContent=APP_VERSION;var ST={};function showLoad(v){document.getElementById('loading').classList.toggle('show',!!v)}function session(){try{return JSON.parse(localStorage.getItem('genba_session')||'null')}catch(e){return null}}function getSecret(){var s=session();return(s&&(s.token||s.secret))||localStorage.getItem('genba_admin')||''}function jsonp(params){return new Promise(function(resolve,reject){if(!GAS_URL){reject(new Error('GAS_URLなし'));return}var cb='cb_'+Date.now()+'_'+Math.floor(Math.random()*1e6);params=params||{};params.callback=cb;params.secret=getSecret();params._ts=Date.now();params._build=BUILD_ID;var s=document.createElement('script'),timer=setTimeout(function(){finish('timeout')},25000),done=false;function finish(k,res){if(done)return;done=true;clearTimeout(timer);try{delete window[cb]}catch(e){}if(s.parentNode)s.parentNode.removeChild(s);if(k==='ok')resolve(res||{});else reject(new Error(k))}window[cb]=function(res){finish('ok',res)};s.onerror=function(){finish('error')};s.src=GAS_URL+'?'+Object.keys(params).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(params[k])}).join('&');document.head.appendChild(s)})}function v(k,d){return ST[k]||d||''}function render(){var service=v('販売_サービス名','Gen-Can'),seller=v('販売_販売会社名',(window.GENBA_CONFIG&&window.GENBA_CONFIG.COMPANY_NAME)||'販売者名'),fee=v('販売_月額料金','5,000円'),init=v('販売_初期設定費','別途見積'),mail=v('販売_問い合わせメール','問い合わせ先メール'),support=v('販売_サポート範囲','初期設定、基本操作説明、軽微な不具合確認'),out=v('販売_対象外作業','大規模カスタム、端末・通信環境不良等');document.getElementById('terms').textContent='利用規約\n\n第1条（目的）\n本規約は、'+seller+'が提供する現場管理アプリ「'+service+'」の利用条件を定めるものです。\n\n第2条（サービス内容）\n本サービスは、現場管理、ファイル管理、工事写真、小黒板カメラ、工事写真台帳等を補助する業務支援ツールです。\n\n第3条（料金）\n月額利用料は '+fee+'、初期設定費は '+init+' とします。個別カスタム、追加設定、訪問対応等は別途見積とします。\n\n第4条（サポート範囲）\n月額料金に含む主なサポート範囲は以下の通りです。\n'+support+'\n\n第5条（対象外）\n以下は原則としてサポート対象外または別料金です。\n'+out+'\n\n第6条（データ管理）\n本サービスで扱うデータは、利用者が管理するGoogle DriveおよびGoogleスプレッドシート等に保存されます。利用者はGoogleアカウント、アクセス権限、バックアップ管理を適切に行うものとします。\n\n第7条（免責）\n通信障害、Google等第三者サービスの仕様変更、利用者端末の不具合、誤操作等により発生した損害について、提供者は合理的な範囲を超えて責任を負いません。\n\n第8条（解約）\n解約条件、日割り精算の有無、データ引き渡し方法は、申込時の条件に従います。';document.getElementById('privacy').textContent='プライバシーポリシー\n\n'+seller+'は、'+service+'の提供にあたり取得する会社名、担当者名、メールアドレス、現場情報、写真、業務データ等を、本サービスの提供、保守、問い合わせ対応、品質改善の目的で利用します。\n\n取得した情報は、法令に基づく場合を除き、本人の同意なく第三者へ提供しません。\n\n本サービスはGoogle Drive、Googleスプレッドシート、Google Apps Script等の外部サービスを利用します。これら外部サービス上のデータ管理、アクセス権限、アカウント管理は利用者の責任で行うものとします。\n\n個人情報に関する問い合わせ先：'+mail;var opsMgr=v('販売_運営責任者','＿＿＿＿＿＿'),addr=v('販売_所在地','＿＿＿＿＿＿'),tel=v('販売_電話番号','＿＿＿＿＿＿'),payM=v('販売_支払方法','＿＿＿＿＿＿'),payT=v('販売_支払時期','＿＿＿＿＿＿'),cancelC=v('販売_解約条件','＿＿＿＿＿＿');document.getElementById('commerce').textContent='特定商取引法に基づく表示\n\n販売事業者：'+seller+'\n運営責任者：'+opsMgr+'\n所在地：'+addr+'\n電話番号：'+tel+'\nメールアドレス：'+mail+'\n販売価格：月額 '+fee+'\n初期設定費：'+init+'\n商品代金以外の必要料金：インターネット通信料、Googleアカウント・Googleストレージ等の利用料、個別カスタム費用等\n支払方法：'+payM+'\n支払時期：'+payT+'\nサービス提供時期：初期設定完了後、案内するURLより利用可能\n解約条件：'+cancelC+'\n返品・キャンセル：デジタルサービスの性質上、利用開始後の返金は原則不可。ただし個別契約条件を優先します。'}function loadSettings(){showLoad(true);jsonp({action:'settings'}).then(function(res){showLoad(false);ST=res.settings||{};render()}).catch(function(){showLoad(false);render()})}function copyText(id){var t=document.getElementById(id).textContent||'';navigator.clipboard.writeText(t).then(function(){alert('コピーしました')}).catch(function(){prompt('コピーしてください',t)})}render();loadSettings();</script><script src="../common_ui.js?v=20260704-v43-18-3"></script></body></html>
