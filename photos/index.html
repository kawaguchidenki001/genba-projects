<html lang="ja">
<head>

<title>工事写真｜Gen-Can</title>

<style>
:root{--bg:#e8ecf2;--ink:#1f3a52;--sub:#5e7a92;--line:#dbe2ea;--accent:#dc2626;--accent-d:#991b1b;--accent-soft:#fee2e2;--grad:linear-gradient(92deg,#06b6d4 10%,#2563eb 55%,#7c3aed 95%);--rise:6px 6px 12px #cdd3dc,-6px -6px 12px #ffffff;--rise-sm:4px 4px 8px #cdd3dc,-4px -4px 8px #ffffff;--well:inset 3px 3px 6px #cdd3dc,inset -3px -3px 6px #ffffff;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;}
body{min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",sans-serif;font-size:16px;line-height:1.6;padding-bottom:32px;}
header{position:sticky;top:0;z-index:10;background:var(--bg);padding:calc(env(safe-area-inset-top) + 12px) 14px 12px;box-shadow:0 6px 14px -10px rgba(31,90,168,.4);}
.hbar{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"back . right" "title title title";align-items:center;row-gap:12px;column-gap:8px;max-width:760px;margin:0 auto;}
.back{grid-area:back;font-family:"Manrope",sans-serif;font-weight:700;font-size:11.5px;letter-spacing:.05em;color:var(--accent-d);background:var(--bg);box-shadow:var(--rise-sm);border-radius:999px;padding:9px 14px;text-decoration:none;white-space:nowrap;}
.back:active{box-shadow:var(--well);}
.hright{grid-area:right;justify-self:end;display:flex;align-items:center;gap:9px;}
.hcenter{grid-area:title;justify-self:center;display:flex;align-items:center;gap:11px;min-width:0;text-align:center;}
.hic{width:44px;height:44px;border-radius:50%;background:var(--bg);box-shadow:var(--well);display:flex;align-items:center;justify-content:center;color:var(--accent);}
.hic svg{width:23px;height:23px;}
.en{font-family:"Manrope",sans-serif;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--sub);display:block;}
h1{font-size:20px;margin:0;font-weight:800;letter-spacing:.02em;color:var(--ink);line-height:1.15;}
.hmark{font-family:"Montserrat",sans-serif;font-weight:900;font-style:italic;font-size:15px;background-image:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
.wrap{max-width:760px;margin:0 auto;padding:18px 14px 36px;}
.lead{background:var(--bg);border-radius:18px;box-shadow:var(--rise);padding:15px 16px;margin-bottom:14px;color:var(--sub);font-weight:700;font-size:13.5px;}
.grid{display:grid;grid-template-columns:1fr;gap:12px;}
.card{position:relative;display:flex;align-items:center;gap:15px;text-decoration:none;color:var(--ink);background:var(--bg);border-radius:18px;box-shadow:var(--rise);padding:18px;min-height:94px;overflow:hidden;}
.card:active{box-shadow:var(--well);}
.ic{width:54px;height:54px;border-radius:18px;background:var(--bg);box-shadow:var(--well);display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--accent);}
.ic svg{width:28px;height:28px;}
.nm{font-weight:900;font-size:18px;color:var(--ink);line-height:1.25;}
.ds{font-size:13px;color:var(--sub);font-weight:700;margin-top:4px;line-height:1.45;}
.cor{margin-left:auto;color:var(--sub);font-size:20px;font-weight:900;}
.note{font-size:12px;color:var(--sub);margin-top:14px;text-align:center;}
@media (max-width:520px){.card{padding:16px;}.ic{width:50px;height:50px}.nm{font-size:17px}.ds{font-size:12.5px}}
</style>
</head>
<body>
<header>
  <div class="hbar">
    <a class="back" href="../">← メニュー</a>
    <div class="hcenter"><span class="hic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5a2 2 0 0 1 2-2h1.6l1.4-2h6l1.4 2H19a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><circle cx="12" cy="12.5" r="3.2"/><path d="M16.5 9.2h.01"/></svg></span><div><span class="en">Construction Photos</span><h1>工事写真</h1></div></div>
    <div class="hright"><span class="hmark">Gen-Can</span></div>
  </div>
</header>
<div class="wrap">
  <div class="lead">工事写真に関係する機能をここにまとめました。通常の現場ファイル閲覧は、メニューの「ファイル」から開けます。</div>
  <div class="grid">
    <a class="card" href="../toolbox/?tool=board&from=photos&mode=live&v=43-8-3"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5a2 2 0 0 1 2-2h1.6l1.4-2h6l1.4 2H19a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><circle cx="12" cy="12.5" r="3.2"/></svg></span><span><span class="en">Blackboard Camera</span><div class="nm">小黒板カメラ</div><div class="ds">工事名・場所を入れて黒板付き写真を撮影</div></span><span class="cor">→</span></a>
    <a class="card" href="../files/?mode=ledger&v=43-8-3"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h9l4 4v16H6z"/><path d="M14 2v5h5M9 12h6M9 16h6"/></svg></span><span><span class="en">Photo Ledger</span><div class="nm">工事写真台帳</div><div class="ds">台帳候補の写真を選んでPDF・Excelを作成</div></span><span class="cor">→</span></a>
  </div>
  <div class="note">写真台帳は、現場フォルダ選択後に台帳候補写真を表示します。</div>
</div>

</html>
