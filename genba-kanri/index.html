<!-- 現場管理（Gen-Can 現場管理特化版） v1.0.1 (2026-11-02) / Gen-Canと同じGAS・スプレッドシート・Driveを共用。GAS変更なし。 -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>現場管理</title>
<meta name="description" content="現場・工程表・工事写真・日報・人員配置・図面の指摘と検査をまとめた現場管理アプリ">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="現場管理">
<meta name="theme-color" content="#1e40af">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./app.css?v=1.0.1">
</head>
<body>
<noscript>JavaScriptを有効にしてください。</noscript>

<!-- ログイン（Gen-Canと同じアカウント・同じログイン状態を共有） -->
<div id="login" class="login" hidden>
  <form class="login-box" id="loginForm" autocomplete="on">
    <div class="login-logo" aria-hidden="true">
      <svg viewBox="0 0 48 48" width="56" height="56"><rect x="2" y="2" width="44" height="44" rx="12" fill="#1e40af"/><path d="M10 34h28M14 34V20l10-7 10 7v14M20 34v-8h8v8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h1>現場管理</h1>
    <p class="login-sub">Gen-Canと同じIDとパスワードでログインします</p>
    <label class="fld"><span>ログインID</span><input id="lgId" name="username" autocomplete="username" required></label>
    <label class="fld"><span>パスワード</span><input id="lgPw" name="password" type="password" autocomplete="current-password"></label>
    <div class="login-err" id="lgErr" role="alert"></div>
    <button class="btn primary block" id="lgBtn" type="submit">ログイン</button>
    <div class="login-ver" id="lgVer"></div>
  </form>
</div>

<!-- アプリ本体 -->
<div id="app" hidden>
  <header class="topbar" id="topbar">
    <button class="tb-back" id="tbBack" type="button" aria-label="戻る" hidden>
      <svg viewBox="0 0 24 24" width="24" height="24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="tb-title" id="tbTitle">現場管理</div>
    <div class="tb-right" id="tbRight"></div>
    <div class="tb-sync" id="tbSync" hidden></div>
  </header>
  <main id="view" class="view" tabindex="-1"></main>
  <nav class="tabbar" id="tabbar" aria-label="メインメニュー">
    <a href="#/today" data-tab="today"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>今日</span></a>
    <a href="#/projects" data-tab="projects"><svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V9l7-5 7 5v12M9 21v-6h6v6"/></svg><span>現場</span></a>
    <a href="#/photos" data-tab="photos"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span>写真</span></a>
    <a href="#/reports" data-tab="reports"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 12h7M9 16h7"/></svg><span>日報</span></a>
    <a href="#/issues" data-tab="issues"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.1-7-11.5A7 7 0 0 1 19 9.5C19 14.9 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span>指摘</span></a>
  </nav>
</div>

<div id="sheetRoot"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="busy" class="busy" hidden><div class="spin"></div><div id="busyTxt">処理中…</div></div>

<!-- 会社名・GASのURLはGen-Canの共通設定（../config.js）をそのまま使います（このアプリ側では書き換えません） -->
<script src="../config.js?v=gk-1.0.1"></script>
<script src="./js/core.js?v=1.0.1"></script>
<script src="./js/home.js?v=1.0.1"></script>
<script src="./js/projects.js?v=1.0.1"></script>
<script src="./js/photos.js?v=1.0.1"></script>
<script src="./js/reports.js?v=1.0.1"></script>
<script src="./js/issues.js?v=1.0.1"></script>
<script>GK.boot();</script>
</body>
</html>
